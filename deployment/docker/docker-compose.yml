services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  agent:
    image: ${DOCKERHUB_USERNAME:-local}/${DOCKERHUB_BACKEND_REPO:-rag-chatbot-backend}:latest
    ports:
      - "8000:8000"
    env_file:
      - path: ../../backend.env
        required: false
      - path: backend.env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongo:27017/rag_chatbot
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/${DOCKERHUB_FRONTEND_REPO:-rag-chatbot-frontend}:latest
    ports:
      - "3000:3000"
    env_file:
      - path: ../../frontend.env
        required: false
      - path: frontend.env
        required: false
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://agent:8000}
    depends_on:
      - agent

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
      - frontend

volumes:
  redis-data:
  mongo-data:
