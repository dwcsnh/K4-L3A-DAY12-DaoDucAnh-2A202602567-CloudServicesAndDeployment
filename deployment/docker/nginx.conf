# Nginx configuration for RAG Chatbot: frontend, backend, and health probes
events {
    worker_connections 1024;
}

http {
    upstream agent_backend {
        server agent:8000;
    }

    upstream frontend_backend {
        server frontend:3000;
    }

    server {
        listen 80;

        proxy_next_upstream error timeout http_502 http_503;

        location /health {
            proxy_pass http://agent_backend/health;
        }

        location /ready {
            proxy_pass http://agent_backend/ready;
        }

        location /ask {
            proxy_pass http://agent_backend/ask;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://agent_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
