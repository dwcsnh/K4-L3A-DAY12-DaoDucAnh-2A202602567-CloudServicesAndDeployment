name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # test:
  #   name: Run Unit Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.11"

  #     - name: Install dependencies
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install -r requirements.txt

  #     - name: Run pytest
  #       run: |
  #         pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py

  build:
    name: Build Docker Images
    # needs: test
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_BACKEND_REPO: ${{ secrets.DOCKERHUB_BACKEND_REPO }}
      DOCKERHUB_FRONTEND_REPO: ${{ secrets.DOCKERHUB_FRONTEND_REPO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_BACKEND_REPO || 'rag-chatbot-backend' }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_FRONTEND_REPO || 'rag-chatbot-frontend' }}:latest

  deploy:
    name: Deploy to Lightsail
    needs: [ build]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lightsail]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Env Files
        run: |
          echo "AGENT_API_KEY=${{ secrets.AGENT_API_KEY }}" > backend.env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> backend.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend.env
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> backend.env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> backend.env
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> backend.env
          
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > frontend.env

          # Make env files available directly to deployment directory as well
          cp backend.env deployment/docker/backend.env
          cp frontend.env deployment/docker/frontend.env

      - name: Deploy with Docker Compose
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_BACKEND_REPO: ${{ secrets.DOCKERHUB_BACKEND_REPO }}
          DOCKERHUB_FRONTEND_REPO: ${{ secrets.DOCKERHUB_FRONTEND_REPO }}
        run: |
          docker compose -f deployment/docker/docker-compose.yml down
          docker compose -f deployment/docker/docker-compose.yml pull
          docker compose -f deployment/docker/docker-compose.yml up -d
          docker image prune -f
